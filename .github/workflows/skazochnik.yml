name: Сборка Сказочника

on:
  push:
    paths:
      - "skazochnik/**"
      - ".github/workflows/skazochnik.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skazochnik
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk skazochnik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: skazochnik-apk
          path: skazochnik/skazochnik.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skazochnik-build-${{ github.run_number }}
          name: Сказочник (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Скачайте `skazochnik.apk` на телефон и откройте его, чтобы установить.
            Ветка: `${{ github.ref_name }}`, коммит: `${{ github.sha }}`.
          files: skazochnik/skazochnik.apk
